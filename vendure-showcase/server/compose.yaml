# Eigener Projektname: Ohne ihn hieße das Projekt nach dem Ordner „server“, genau wie die
# lokale Buchart58-DB, und beide teilten sich das Volume server_pgdata (down -v löschte es).
name: vendure-showcase-dev

services:
  db:
    # Gleiche Major wie compose.prod.yaml. Ein Volume aus einer älteren Major (etwa
    # postgres:16) startet mit 18 nicht, das Log meldet „there appears to be PostgreSQL
    # data in /var/lib/postgresql“. Dann `podman compose down -v` und neu seeden.
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wine_server
      POSTGRES_USER: vendure
      POSTGRES_PASSWORD: vendure_pw
    volumes:
      # postgres:18-Image: PGDATA liegt unter /var/lib/postgresql/18/docker,
      # Volume deshalb auf das Parent-Verzeichnis mounten (nicht mehr …/data).
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendure -d wine_server"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: wine_server
      DB_USER: vendure
      DB_PASSWORD: vendure_pw
      NODE_ENV: production
      PORT: "3000"
      ADMIN_PORT: "3002"
      SUPERADMIN_USERNAME: superadmin
      SUPERADMIN_PASSWORD: superadmin
      COOKIE_SECRET: change-me-in-production
      CORS_ORIGINS: "http://localhost:5173,http://localhost:4321"
    ports:
      - "3000:3000"
      - "3002:3002"
    volumes:
      - assets:/app/data/assets

volumes:
  pgdata:
  assets:
